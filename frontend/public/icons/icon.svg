<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background Container with Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Radar Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#60a5fa" stroke-width="6" stroke-opacity="0.35" stroke-dasharray="12 12"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#93c5fd" stroke-width="8" stroke-opacity="0.5"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#bfdbfe" stroke-width="8" stroke-opacity="0.7"/>

  <!-- Center Pulse Target -->
  <circle cx="256" cy="256" r="32" fill="url(#accentGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="16" fill="#ffffff"/>

  <!-- Location Pin Arrow -->
  <path d="M256 96 L284 190 L380 216 L300 274 L324 370 L256 312 L188 370 L212 274 L132 216 L228 190 Z" fill="#ffffff" opacity="0.95"/>

  <!-- Inner Badge Stamp -->
  <circle cx="256" cy="256" r="8" fill="#10b981"/>
</svg>
