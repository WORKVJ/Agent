version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostGIS Database (Geospatial PostgreSQL)
  # ----------------------------------------------------------------------------
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: agentpulse_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentpulse_db}
      POSTGRES_USER: ${POSTGRES_USER:-agentpulse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentpulse_secret_pass_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentpulse_user} -d ${POSTGRES_DB:-agentpulse_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Redis Channel Layer & Cache
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: agentpulse_redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. Django REST API + Channels Daphne ASGI Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentpulse_backend
    restart: always
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-production-super-secret-key-agentpulse-hq-2026}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      DATABASE_URL: postgresql://${POSTGRES_USER:-agentpulse_user}:${POSTGRES_PASSWORD:-agentpulse_secret_pass_2026}@db:5432/${POSTGRES_DB:-agentpulse_db}
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-True}
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python seed_data.py &&
             daphne -b 0.0.0.0 -p 8000 core.asgi:application"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  # ----------------------------------------------------------------------------
  # 4. Next.js 16 Production Frontend
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentpulse_frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/location/}
    depends_on:
      - backend
    expose:
      - "3000"

  # ----------------------------------------------------------------------------
  # 5. Nginx Web Server & Reverse Proxy
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: agentpulse_nginx
    restart: always
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media_volume:/app/media:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  redisdata:
  media_volume:
  static_volume:
